name: Linux AppImage canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver prerelease version (for example 1.0.76-beta.3)
        required: true
        default: 1.0.76-beta.3
        type: string
      publish_prerelease:
        description: Publish a GitHub prerelease after the artifact build passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      CANARY_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Validate the canary version
        shell: bash
        run: |
          if [[ ! "$CANARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Expected a prerelease such as 1.0.76-beta.3; got: $CANARY_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the Electron and Node runtime toolchain
        shell: bash
        run: |
          node -e "const v=require('./node_modules/electron/package.json').version; if (!v.startsWith('43.')) throw new Error('Expected Electron 43.x, got '+v); console.log('Electron '+v)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Expected Node 24.x, got '+process.versions.node); console.log('Node '+process.versions.node)"
          npm ls electron @types/node --depth=0

      - name: Audit the installed dependency graph
        run: npm audit --audit-level=high

      - name: Remove stale build output
        run: rm -rf dist out

      - name: Stamp the canary version without creating a tag
        run: npm version "$CANARY_VERSION" --no-git-tag-version --allow-same-version

      - name: Select the isolated prerelease channel
        shell: bash
        run: |
          CHANNEL="${CANARY_VERSION#*-}"
          CHANNEL="${CHANNEL%%.*}"
          echo "WL_LINUX_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Run the release gate
        run: npm run typecheck && npm test && npm run lint

      - name: Build the AppImage without publishing
        run: npm run build:linux -- --config.publish.channel="$WL_LINUX_CHANNEL"

      - name: Extract the packaged runtime evidence
        shell: bash
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$APPIMAGE" ]]; then
            echo "No AppImage was produced" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE"
          rm -rf dist/squashfs-root
          (
            cd dist
            "./$(basename "$APPIMAGE")" --appimage-extract >/dev/null
          )
          PACKAGED_CONFIG="$(find dist/squashfs-root -type f -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$PACKAGED_CONFIG" ]]; then
            echo "The AppImage does not contain resources/app-update.yml" >&2
            exit 1
          fi
          cp "$PACKAGED_CONFIG" dist/packaged-app-update.yml
          PACKAGED_ASAR="$(find dist/squashfs-root -type f -path '*/resources/app.asar' -print -quit)"
          if [[ -z "$PACKAGED_ASAR" ]]; then
            echo "The AppImage does not contain resources/app.asar" >&2
            exit 1
          fi
          cp "$PACKAGED_ASAR" dist/packaged-app.asar
          PACKAGED_LAUNCHER="dist/squashfs-root/wraeclastledger"
          PACKAGED_BINARY="dist/squashfs-root/wraeclastledger-bin"
          if [[ ! -x "$PACKAGED_LAUNCHER" ]]; then
            echo "The AppImage does not contain the executable Linux launcher wrapper" >&2
            exit 1
          fi
          if [[ ! -x "$PACKAGED_BINARY" ]]; then
            echo "The AppImage does not contain the wrapped Electron executable" >&2
            exit 1
          fi
          cp "$PACKAGED_LAUNCHER" dist/packaged-linux-launcher
          printf 'bytes=%s\nsha256=%s\n' \
            "$(stat -c '%s' "$PACKAGED_BINARY")" \
            "$(sha256sum "$PACKAGED_BINARY" | cut -d ' ' -f 1)" \
            > dist/packaged-linux-binary.txt
          PACKAGED_HELPER="$(find dist/squashfs-root -type f -path '*/resources/linux/wl-proton-clipboard.exe' -print -quit)"
          if [[ -z "$PACKAGED_HELPER" ]]; then
            echo "The AppImage does not contain the Proton clipboard helper" >&2
            exit 1
          fi
          cp "$PACKAGED_HELPER" dist/packaged-wl-proton-clipboard.exe
          PACKAGED_DESKTOP="$(find dist/squashfs-root -maxdepth 1 -type f -name '*.desktop' -print -quit)"
          if [[ -z "$PACKAGED_DESKTOP" ]]; then
            echo "The AppImage does not contain a desktop launcher" >&2
            exit 1
          fi
          if [[ "$(basename "$PACKAGED_DESKTOP")" != "com.wraeclastledger.app.desktop" ]]; then
            echo "The AppImage desktop launcher has an unexpected identity: $(basename "$PACKAGED_DESKTOP")" >&2
            exit 1
          fi
          cp "$PACKAGED_DESKTOP" dist/com.wraeclastledger.app.desktop
          rm -rf dist/squashfs-root

      - name: Verify the updater artifacts and channel isolation
        run: npm run verify:linux:canary

      - name: Upload the verified build evidence
        uses: actions/upload-artifact@v7
        with:
          name: WraeclastLedger-${{ env.CANARY_VERSION }}-linux-x64
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*-linux.yml
            dist/packaged-app-update.yml
            dist/packaged-linux-launcher
            dist/packaged-linux-binary.txt
            dist/packaged-wl-proton-clipboard.exe
            dist/com.wraeclastledger.app.desktop
            dist/linux-canary-evidence.json
            electron-builder.yml

  publish:
    needs: appimage
    if: ${{ inputs.publish_prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CANARY_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download the exact verified build
        uses: actions/download-artifact@v8
        with:
          name: WraeclastLedger-${{ env.CANARY_VERSION }}-linux-x64
          path: canary-artifact

      - name: Publish the verified AppImage prerelease
        shell: bash
        run: |
          CHANNEL="${CANARY_VERSION#*-}"
          CHANNEL="${CHANNEL%%.*}"
          gh release create "v${CANARY_VERSION}" \
            "canary-artifact/dist/WraeclastLedger-${CANARY_VERSION}-x86_64.AppImage" \
            "canary-artifact/dist/${CHANNEL}-linux.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WraeclastLedger ${CANARY_VERSION} Linux AppImage canary" \
            --notes "Experimental x86_64 AppImage for Linux smoke testing. Not a stable supported release." \
            --prerelease
