name: Linux AppImage stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version (for example 1.0.76)
        required: true
        type: string
      publish_release_assets:
        description: Attach the verified AppImage and latest-linux.yml to the existing release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7

      - name: Resolve and validate the stable version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version such as 1.0.76; got: $RAW_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the Electron and Node runtime toolchain
        shell: bash
        run: |
          node -e "const v=require('./node_modules/electron/package.json').version; if (!v.startsWith('43.')) throw new Error('Expected Electron 43.x, got '+v); console.log('Electron '+v)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Expected Node 24.x, got '+process.versions.node); console.log('Node '+process.versions.node)"
          npm ls electron @types/node --depth=0

      - name: Audit the installed dependency graph
        run: npm audit --audit-level=high

      - name: Remove stale build output
        run: rm -rf dist out

      - name: Stamp the stable version without creating a tag
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Run the release gate
        run: npm run typecheck && npm test && npm run lint

      - name: Build the AppImage without publishing
        run: npm run build:linux

      - name: Extract the packaged runtime evidence
        shell: bash
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$APPIMAGE" ]]; then
            echo "No AppImage was produced" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE"
          rm -rf dist/squashfs-root
          (
            cd dist
            "./$(basename "$APPIMAGE")" --appimage-extract >/dev/null
          )
          PACKAGED_CONFIG="$(find dist/squashfs-root -type f -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$PACKAGED_CONFIG" ]]; then
            echo "The AppImage does not contain resources/app-update.yml" >&2
            exit 1
          fi
          cp "$PACKAGED_CONFIG" dist/packaged-app-update.yml
          PACKAGED_ASAR="$(find dist/squashfs-root -type f -path '*/resources/app.asar' -print -quit)"
          if [[ -z "$PACKAGED_ASAR" ]]; then
            echo "The AppImage does not contain resources/app.asar" >&2
            exit 1
          fi
          cp "$PACKAGED_ASAR" dist/packaged-app.asar
          PACKAGED_HELPER="$(find dist/squashfs-root -type f -path '*/resources/linux/wl-proton-clipboard.exe' -print -quit)"
          if [[ -z "$PACKAGED_HELPER" ]]; then
            echo "The AppImage does not contain the Proton clipboard helper" >&2
            exit 1
          fi
          cp "$PACKAGED_HELPER" dist/packaged-wl-proton-clipboard.exe
          PACKAGED_DESKTOP="$(find dist/squashfs-root -maxdepth 1 -type f -name '*.desktop' -print -quit)"
          if [[ -z "$PACKAGED_DESKTOP" ]]; then
            echo "The AppImage does not contain a desktop launcher" >&2
            exit 1
          fi
          if [[ "$(basename "$PACKAGED_DESKTOP")" != "com.wraeclastledger.app.desktop" ]]; then
            echo "The AppImage desktop launcher has an unexpected identity: $(basename "$PACKAGED_DESKTOP")" >&2
            exit 1
          fi
          cp "$PACKAGED_DESKTOP" dist/com.wraeclastledger.app.desktop
          rm -rf dist/squashfs-root

      - name: Verify the stable updater artifacts
        run: npm run verify:linux:release

      - name: Upload the exact verified build
        uses: actions/upload-artifact@v7
        with:
          name: WraeclastLedger-linux-x64-stable
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/packaged-app-update.yml
            dist/packaged-wl-proton-clipboard.exe
            dist/com.wraeclastledger.app.desktop
            dist/linux-release-evidence.json
            electron-builder.yml

  publish:
    needs: appimage
    if: ${{ inputs.publish_release_assets }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Normalize the stable version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Download the exact verified build
        uses: actions/download-artifact@v8
        with:
          name: WraeclastLedger-linux-x64-stable
          path: release-artifact

      - name: Confirm the release and source SHA
        shell: bash
        run: |
          RELEASE_JSON="$(gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" != "false" || "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" != "false" ]]; then
            echo "v${RELEASE_VERSION} is not an existing published stable release" >&2
            exit 1
          fi
          SOURCE_SHA="$(jq -r '.sourceSha' release-artifact/dist/linux-release-evidence.json)"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${RELEASE_VERSION}" --jq '.sha')"
          if [[ "$SOURCE_SHA" != "$TAG_SHA" ]]; then
            echo "Verified artifact source $SOURCE_SHA does not match release tag source $TAG_SHA" >&2
            exit 1
          fi

      - name: Attach the verified Linux updater assets
        shell: bash
        run: |
          gh release upload "v${RELEASE_VERSION}" \
            "release-artifact/dist/WraeclastLedger-${RELEASE_VERSION}-x86_64.AppImage" \
            "release-artifact/dist/latest-linux.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
